name: fork-opencode-image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tag: latest
            base_image: alpine:3.21
            dist_suffix: -musl
          - tag: ubuntu
            base_image: ubuntu:24.04
            dist_suffix: ""
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun run --cwd packages/opencode build

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: packages/opencode
          file: packages/opencode/Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            DIST_SUFFIX=${{ matrix.dist_suffix }}
          tags: ghcr.io/${{ github.repository_owner }}/opencode-fork:${{ matrix.tag }}
